name: "CI Pipeline"

triggers:
  - push:
      branches:
        - main
        - develop
  - pull_request:
      paths:
        - "src/**"
        - "tests/**"

jobs:
  build:
    runs_on: "ubuntu-latest"
    steps:
      - name: "Checkout code"
        uses: "actions/checkout@v2"
      - name: "Set up Rust"
        uses: "actions-rs/toolchain@v1"
        with:
          toolchain: "stable"
      - name: "Build project"
        run: "cargo build --release"

  test:
    runs_on: "ubuntu-latest"
    steps:
      - name: "Run tests"
        run: "cargo test --all"

  deploy:
    runs_on: "ubuntu-latest"
    steps:
      - name: "Deploy to production"
        run: "./deploy.sh"
